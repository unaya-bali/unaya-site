<!-- title: Confier ma villa — Unaya Management -->
<section style="max-width: 1280px; margin: 0 auto; padding: 56px 32px 88px; display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start;">
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 22px;">
<div style="font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase; color: #8B5A46;">Confier ma villa</div>
<h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 64px; line-height: 1.05; color: #3F2A3A;">Parlez-nous de votre villa.</h1>
<p style="margin: 0; font-size: 19px;">Remplissez ce formulaire en 2 minutes. Nous vous recontactons sous 24 h pour organiser une visite et vous remettre une estimation de revenus, gratuite et sans engagement.</p>
<div style="height: 340px; border-radius: 170px 170px 0 0; overflow: hidden;"><img src="/assets/images/suma-piscine.jpg" alt="Piscine de la Villa Suma" style="width: 100%; height: 100%; object-fit: cover; display: block;"></div>
</div>
<form style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E6DCD4; padding: 40px; display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; flex-wrap: wrap; gap: 20px;"><label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552; flex: 1 1 240px;">Nom complet *<input type="text" style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"></label><label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552; flex: 1 1 240px;">E-mail *<input type="email" style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"></label></div>
<div style="display: flex; flex-wrap: wrap; gap: 20px;"><label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552; flex: 1 1 240px;">Téléphone<input type="tel" style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"></label><label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552; flex: 1 1 240px;">Zone de la villa *<select style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"><option>Nyanyi</option><option>Uluwatu</option><option>Umalas</option><option>Autre</option></select></label></div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552;">Adresse ou lien Google Maps<input type="text" style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"></label>
<div style="display: flex; flex-wrap: wrap; gap: 20px;"><label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552; flex: 1 1 160px;">Chambres *<input type="number" min="1" style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"></label><label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552; flex: 1 1 160px;">Piscine *<select style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"><option>Oui</option><option>Non</option></select></label><label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552; flex: 1 1 160px;">Déjà en location ? *<select style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"><option>Oui</option><option>Non</option></select></label></div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552;">Liens des annonces existantes<input type="text" style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552;">Formule souhaitée *<select style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"><option>Gestion complète</option><option>Marketing seul</option><option>Je ne sais pas encore</option></select></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552;">Message<textarea rows="4" style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"></textarea></label>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px;"><input type="checkbox" style="margin-top: 5px;">J'accepte la politique de confidentialité. *</label>
<button type="button" style="display: inline-block; padding: 16px 30px; background: #3F2A3A; color: #F7F2EE; text-decoration: none; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; border: none; font-family: 'Jost', sans-serif; cursor: pointer; align-self: flex-start;">Envoyer ma demande</button>
</form>
</section>
