<!-- title: List my villa — Unaya Management -->
<section style="max-width: 1280px; margin: 0 auto; padding: 56px 32px 88px; display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start;">
<div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 22px;">
<div style="font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase; color: #8B5A46;">List my villa</div>
<h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 64px; line-height: 1.05; color: #3F2A3A;">Tell us about your villa.</h1>
<p style="margin: 0; font-size: 19px;">Fill in this form in 2 minutes. We'll get back to you within 24 hours to arrange a visit and give you a free, no-obligation income estimate.</p>
<div style="height: 340px; border-radius: 170px 170px 0 0; overflow: hidden;"><img src="/assets/images/suma-piscine.jpg" alt="Pool at Villa Suma" style="width: 100%; height: 100%; object-fit: cover; display: block;"></div>
</div>
<form style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E6DCD4; padding: 40px; display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; flex-wrap: wrap; gap: 20px;"><label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552; flex: 1 1 240px;">Full name *<input type="text" style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"></label><label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552; flex: 1 1 240px;">Email *<input type="email" style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"></label></div>
<div style="display: flex; flex-wrap: wrap; gap: 20px;"><label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552; flex: 1 1 240px;">Phone<input type="tel" style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"></label><label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552; flex: 1 1 240px;">Villa area *<select style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"><option>Uluwatu / Jimbaran</option><option>Tanah Lot / Canggu West</option><option>Seminyak / Kerobokan</option><option>Other</option></select></label></div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552;">Address or Google Maps link<input type="text" style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"></label>
<div style="display: flex; flex-wrap: wrap; gap: 20px;"><label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552; flex: 1 1 160px;">Bedrooms *<input type="number" min="1" style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"></label><label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552; flex: 1 1 160px;">Pool *<select style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"><option>Yes</option><option>No</option></select></label><label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552; flex: 1 1 160px;">Already rented out? *<select style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"><option>Yes</option><option>No</option></select></label></div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552;">Links to existing listings<input type="text" style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552;">Preferred plan *<select style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"><option>Full Management</option><option>Marketing Only</option><option>Not sure yet</option></select></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #5A3552;">Message<textarea rows="4" style="font-family: 'Jost', sans-serif; font-size: 16px; padding: 14px; border: 1px solid #D9CCC2; background: #FFFFFF; color: #2E2429;"></textarea></label>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px;"><input type="checkbox" style="margin-top: 5px;">I accept the privacy policy. *</label>
<button type="button" style="display: inline-block; padding: 16px 30px; background: #3F2A3A; color: #F7F2EE; text-decoration: none; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; border: none; font-family: 'Jost', sans-serif; cursor: pointer; align-self: flex-start;">Send my request</button>
</form>
</section>
